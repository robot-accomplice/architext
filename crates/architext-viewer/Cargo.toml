[package]
name = "architext-viewer"
version = "0.0.0"
edition = "2021"
publish = false

# CSR wasm app. cdylib is the wasm-bindgen entry; rlib lets `cargo test`/docs
# work on native. The crate only builds meaningfully for wasm32 (Leptos CSR),
# so it is excluded from the workspace default-members (see workspace Cargo.toml)
# to keep `cargo build --workspace` on native targets green.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Routing engine, wired now so later slices call plan() in-process. The `wasm`
# feature exposes the #[wasm_bindgen] plan() boundary; we depend on it with that
# feature so the viewer wasm bundle carries the planner.
architext-routing = { path = "../architext-routing", features = ["wasm"] }

leptos = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
# Browser clock for note timestamps (ISO string) and the client-minted note id
# (`note-<base36 ms>`). `Date` is unavailable in plain Rust; js-sys exposes the
# JS `Date` to wasm. Declared explicitly rather than relying on transitive
# enablement via web-sys/gloo-net.
js-sys = "0.3"

# Pan/zoom-fit needs to measure the canvas viewport (DomRect from the container
# element). The wheel/mouse event TYPES come from Leptos's typed event handlers;
# we only need web-sys for the element measurement, declared explicitly rather
# than relying on transitive feature enablement.
web-sys = { version = "0.3", features = [
    "DomRect",
    "Element",
    # Live-reload: SSE consumer over the serve `/api/data-events` stream.
    "EventSource",
    "MessageEvent",
    "Event",
    # Theme toggle: persist the choice in localStorage and apply `data-theme`
    # on <html> (Document/Element) so the whole document — popovers included —
    # picks up the light/dark token set.
    "Window",
    "Document",
    "Storage",
    # Code-graph WebGL2 renderer (src/gl): raw WebGL2 via web-sys, zero JS.
    # `HtmlCanvasElement` is already implied transitively by leptos::html::Canvas
    # elsewhere, declared here explicitly since the renderer calls
    # `get_context`/`width`/`height` on it directly.
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlVertexArrayObject",
    "WebGlUniformLocation",
    # Task 5 progressive layout: the RAF layout slice budgets its ticks
    # against `performance.now()` and the time-to-first-paint /
    # time-to-settled instrumentation reads the same clock.
    "Performance",
    # Code-graph animation rework: `prefers-reduced-motion` gate for the
    # progressive edge-draw — read once per tier via `Window::match_media`.
    "MediaQueryList",
    # Plan D Task 3: the layout-settle Web Worker. `Worker` is the main-thread
    # spawn/postMessage/terminate handle (`layout_worker_client.rs`);
    # `DedicatedWorkerGlobalScope` is the worker-side scope the second wasm
    # binary (`src/bin/layout_worker.rs`) posts its reply from. `console` lets
    # that worker log diagnostics directly (it has no Leptos app context to
    # route through `leptos::logging::log!`'s usual path).
    "Worker",
    "DedicatedWorkerGlobalScope",
    "console",
] }

# Same-origin async fetch of the Architext data docs (/data/**, /api/config)
# and the serve plan farm (/api/plan/{hash}).
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
# Non-blocking poll delay (TimeoutFuture) while waiting for the native plan farm
# to warm — keeps the main thread free instead of computing a plan in-process.
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps the config field/section spec in the server's authored
# order (laneWidth, rowGap, …) when the config editor renders controls from the
# parsed `/api/config` payload, instead of alphabetizing them.
serde_json = { version = "1", features = ["preserve_order"] }

# sha256 of the plan key → the `/api/plan/{hash}` farm cache key. Pure-Rust,
# compiles to wasm32; we deliberately do NOT use
# `architext_routing::precompute::plan_key_hash_native` (it needs the native
# feature and returns "" on wasm).
sha2 = "0.10"
